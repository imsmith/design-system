<!DOCTYPE html>
<html lang="en" data-theme="tron">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Navigation components</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="../../assets/marks/sprite-inject.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: var(--space-3); }
  .panel { padding: var(--space-3) var(--space-2); font-family: var(--font-mono); font-size: var(--text-small); color: var(--muted); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Tabs, Breadcrumb, Pagination, Menu } = window.DesignSystem_019de4;
function Demo() {
  const [view, setView] = React.useState("grid");
  const labels = { grid: "Grid view — 64 nodes, heatmap.", alerts: "3 active alerts.", audit: "Audit log." };
  const [page, setPage] = React.useState(4);
  const [item, setItem] = React.useState("alerts");
  return (
    <div>
      <Breadcrumb items={[{ label: "Grid", href: "#" }, { label: "Sector 12", href: "#" }, { label: "node-13" }]} />
      <div style={{ height: "var(--space-2)" }} />
      <Tabs value={view} onChange={setView}
        tabs={[
          { id: "grid", label: "Grid", icon: "m-menu" },
          { id: "alerts", label: "Alerts", count: 3 },
          { id: "audit", label: "Audit" },
          { id: "policy", label: "Policy", disabled: true },
        ]} />
      <div className="panel">{labels[view] || "—"}</div>
      <div style={{ display: "flex", gap: "var(--space-3)", alignItems: "flex-start", marginTop: "var(--space-2)" }}>
        <Menu label="Sections" selected={item} onSelect={(it) => setItem(it.id)}
              items={[{ heading: "Grid" }, { id: "grid", label: "Dashboard", icon: "m-menu" }, { id: "alerts", label: "Alerts", icon: "m-bell", hint: 3 }, { separator: true }, { id: "settings", label: "Settings", icon: "m-settings", submenu: true }, { id: "policy", label: "Policy", icon: "m-lock", disabled: true }]} />
        <Pagination page={page} total={9} onChange={setPage} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
