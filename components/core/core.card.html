<!DOCTYPE html>
<html lang="en" data-theme="tron">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Core components</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="../../assets/marks/sprite-inject.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: var(--space-3); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); margin-bottom: var(--space-3); }
  .grp { display: flex; flex-direction: column; gap: var(--space-1); }
  .cap { font-size: var(--text-micro); text-transform: uppercase; letter-spacing: var(--tracking-label); color: var(--muted); }
  .marks { display: flex; gap: var(--space-2); color: var(--accent); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Button, StatusBadge, Tag, Card, Mark, Table, Tooltip } = window.DesignSystem_019de4;

const NODES = [
  { id: "node-11", step: "low", cpu: 42, lat: 18 },
  { id: "node-12", step: "medium", cpu: 78, lat: 41 },
  { id: "node-13", step: "critical", cpu: 97, lat: 212 },
];
function Demo() {
  const [sel, setSel] = React.useState("node-13");
  const [sort, setSort] = React.useState({ key: "cpu", dir: "descending" });
  return (
    <div>
      <div className="row">
        <div className="grp"><span className="cap">primary</span><Button variant="primary" size="lg" icon="m-upload">Engage</Button></div>
        <div className="grp"><span className="cap">ghost</span><Button variant="ghost" icon="m-filter">Filter</Button></div>
        <div className="grp"><span className="cap">text</span><Button variant="text" iconEnd="m-chevron">Details</Button></div>
        <div className="grp"><span className="cap">danger</span><Button variant="danger" icon="m-delete">Delete sector 12</Button></div>
        <div className="grp"><span className="cap">loading</span><Button variant="ghost" loading>Saving</Button></div>
        <div className="grp"><span className="cap">disabled</span><Button variant="ghost" disabled>Locked</Button></div>
      </div>
      <div className="row">
        <StatusBadge step="critical" pulse />
        <StatusBadge step="high" />
        <StatusBadge step="medium" />
        <StatusBadge step="low" />
        <StatusBadge step="unknown" />
        <StatusBadge step="high" variant="solid" label="DEGRADED" />
      </div>
      <div className="row">
        <Tag>sector-12</Tag>
        <Tag icon="m-lock" accent>tlp:amber</Tag>
        <Tag onRemove={() => {}}>region=us-east</Tag>
        <span className="marks">
          <Mark name="m-search" /><Mark name="m-settings" /><Mark name="m-bell" /><Mark name="m-user" /><Mark name="m-refresh" /><Mark name="m-download" />
        </span>
      </div>
      <div className="row">
        <Table density="compact" sort={sort} onSort={(k) => setSort({ key: k, dir: sort.dir === "ascending" ? "descending" : "ascending" })}
               selected={sel} onSelect={(r) => setSel(r.id)}
               columns={[
                 { key: "id", label: "Node", sortable: true },
                 { key: "step", label: "Status", render: (r) => <StatusBadge step={r.step} variant="plain" size={13} /> },
                 { key: "cpu", label: "CPU %", num: true, sortable: true },
                 { key: "lat", label: <Tooltip text="p95 round-trip to the collector">Latency ms</Tooltip>, num: true },
               ]}
               rows={NODES} />
      </div>
      <Card title="node-13 · sector 12" density="compact"
            actions={<Button variant="text" size="sm" iconEnd="m-more" aria-label="More" />}>
        <div style={{ fontSize: "var(--text-small)", color: "var(--muted)" }}>
          Surface panel — the dashboard building block. Border, density padding, caption header.
        </div>
      </Card>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
