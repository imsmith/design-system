<!-- @dsCard group="Components" viewport="900x640" name="Feedback — alerts" subtitle="Alert banners keyed to CAP severity" -->
<!DOCTYPE html>
<html lang="en" data-theme="tron">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Feedback components</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="../../assets/marks/sprite-inject.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: var(--space-3); }
  .stack { display: flex; flex-direction: column; gap: var(--space-2); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Alert, Button, StatePanel, Skeleton, Toast, ToastStack, Modal } = window.DesignSystem_019de4;
function Demo() {
  const [open, setOpen] = React.useState(false);
  const [toasts, setToasts] = React.useState([
    { id: 1, severity: "critical", title: "Uplink down — sector 12.", body: "Acknowledge to clear." },
    { id: 2, severity: "low", title: "Rebooted node-12." },
  ]);
  const drop = (id) => setToasts((t) => t.filter((x) => x.id !== id));
  return (
    <div className="stack">
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "var(--space-2)" }}>
        <StatePanel mode="empty" title="No alerts in sector 12" action={<Button variant="ghost" size="sm" icon="m-add">Create rule</Button>}>Nothing crossed a threshold in 24h.</StatePanel>
        <StatePanel mode="loading" title="Loading telemetry"><Skeleton lines={3} /></StatePanel>
        <StatePanel mode="error" title="Telemetry unavailable" action={<Button variant="ghost" size="sm" icon="m-refresh">Retry</Button>}>Collector db-03 timed out after 30s.</StatePanel>
      </div>
      <div><Button variant="danger" icon="m-delete" onClick={() => setOpen(true)}>Delete cluster prod-east</Button></div>
      <Modal open={open} onClose={() => setOpen(false)} title="Delete cluster prod-east" destructive
             footer={<><Button variant="ghost" onClick={() => setOpen(false)}>Cancel</Button><Button variant="danger" icon="m-delete" onClick={() => setOpen(false)}>Delete cluster</Button></>}>
        Deletes 14 nodes and their volumes. This cannot be undone.
      </Modal>
      <ToastStack>
        {toasts.map((t) => <Toast key={t.id} severity={t.severity} title={t.title} onDismiss={() => drop(t.id)} duration={0}>{t.body}</Toast>)}
      </ToastStack>
      <Alert severity="critical" pulse title="Uplink down — sector 12."
             actions={<Button variant="ghost" size="sm" icon="m-refresh">Retry uplink</Button>}>
        4 nodes unreachable for 4m. Reroute traffic or restore the uplink.
      </Alert>
      <Alert severity="medium" title="Latency 41ms on node-13, above 40ms threshold." onDismiss={() => {}}>
        Sustained for 12m. Shed load or raise the threshold.
      </Alert>
      <Alert severity="low" title="Rebooted node-12. Telemetry nominal." onDismiss={() => {}} />
      <Alert severity="info" title="Maintenance window 02:00–02:30 UTC." onDismiss={() => {}} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
