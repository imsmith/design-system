<!-- @dsCard group="Colors" viewport="700x150" name="Status alert ramp" subtitle="Vivid, ordered; bound to OASIS CAP; never color alone" -->
<!DOCTYPE html>
<html lang="en" data-theme="tron">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<script src="../assets/marks/sprite-inject.js"></script>
<style>
  body { margin: 0; padding: var(--space-3); }
  .ramp { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--space-2); }
  .step { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .chip { display: inline-flex; align-items: center; gap: var(--space-1); font-family: var(--font-mono); font-size: var(--text-small); font-weight: 500; text-transform: uppercase; letter-spacing: var(--tracking-label); }
  .bar { width: 100%; height: 10px; border-radius: 999px; }
  .meta { font-family: var(--font-mono); font-size: var(--text-micro); color: var(--muted); }
  svg.g { width: 18px; height: 18px; }
</style>
</head>
<body>
<div class="ramp">
  <div class="step"><span class="chip" style="color:var(--status-critical)"><svg class="g"><use href="#m-critical"/></svg>DOWN</span><span class="bar" style="background:var(--status-critical)"></span><span class="meta">critical · Extreme</span></div>
  <div class="step"><span class="chip" style="color:var(--status-high)"><svg class="g"><use href="#m-high"/></svg>ALERT</span><span class="bar" style="background:var(--status-high)"></span><span class="meta">high · Severe</span></div>
  <div class="step"><span class="chip" style="color:var(--status-medium)"><svg class="g"><use href="#m-medium"/></svg>WARN</span><span class="bar" style="background:var(--status-medium)"></span><span class="meta">medium · Moderate</span></div>
  <div class="step"><span class="chip" style="color:var(--status-low)"><svg class="g"><use href="#m-low"/></svg>OK</span><span class="bar" style="background:var(--status-low)"></span><span class="meta">low · Minor</span></div>
  <div class="step"><span class="chip" style="color:var(--status-unknown)"><svg class="g"><use href="#m-unknown"/></svg>UNK</span><span class="bar" style="background:var(--status-unknown)"></span><span class="meta">unknown · Unknown</span></div>
</div>
</body>
</html>
