<!-- @dsCard group="Brand" viewport="700x160" name="Glow material" subtitle="The only adopted CRT effect; dark surfaces only; ambient + active" -->
<!DOCTYPE html>
<html lang="en" data-theme="tron">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: var(--space-4); display: flex; gap: var(--space-5); align-items: center; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: var(--space-2); }
  .hd { font-family: var(--font-mono); font-size: var(--text-micro); text-transform: uppercase; letter-spacing: var(--tracking-label); color: var(--muted); }
  .chip { width: 88px; height: 44px; border-radius: var(--radius-md); background: var(--accent); }
  .txt { font-family: var(--font-mono); font-size: var(--text-h3); font-weight: 700; color: var(--accent); }
  .note { font-family: var(--font-mono); font-size: var(--text-micro); color: var(--muted); max-width: 22ch; line-height: 1.5; }
</style>
</head>
<body>
  <div class="cell"><span class="hd">ambient · box</span><div class="chip" style="box-shadow:var(--glow-box-ambient)"></div></div>
  <div class="cell"><span class="hd">active · box</span><div class="chip" style="box-shadow:var(--glow-box-active)"></div></div>
  <div class="cell"><span class="hd">ambient · text</span><div class="txt" style="text-shadow:var(--glow-text-ambient)">DOWN</div></div>
  <div class="cell"><span class="hd">active · text</span><div class="txt" style="text-shadow:var(--glow-text-active)">LIVE</div></div>
  <div class="note">Never on body text, data fills, muted, or borders. Suppressed in light mode. Glow only adds — contrast holds without it.</div>
</body>
</html>
